version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: restaurant_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_erp
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d restaurant_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
